name: Deploy to GitHub Pages

# 纯静态站点：直接把仓库根目录发布到 Pages。
# 三个文件（index.html / app.css / app.js）拷过去就能跑，不需要构建。

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.css'
      - 'app.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
